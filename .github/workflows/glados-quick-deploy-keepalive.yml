name: GLaDOS Quick Deploy Keepalive
on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glados-quick-deploy-keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v6
      - name: Keep scheduled workflows active
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/glados-last-active.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/glados-last-active.txt
          git diff --staged --quiet && exit 0
          git commit -m 'chore: keep GLaDOS schedule active [skip ci]'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
